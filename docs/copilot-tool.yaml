openapi: 3.0.3
info:
  title: ECM Platform Agent
  description: >
    Natural-language CRM command endpoint for East Coast Mechanical's ECM
    Platform, for use by the Microsoft Copilot Studio agent only. Contains
    a single action — no unrelated webhook/cron endpoints are exposed here.
  version: "0.1.0"
servers:
  - url: https://ecm-crm-eastcoastmechanics-projects.vercel.app

paths:
  /api/copilot/agent:
    post:
      summary: Full-capability command interface to the East Coast Mechanical CRM — call this for ANY customer, job, document, equipment, warranty, rebate, or task request
      description: >
        This is a real, full-featured CRM assistant, not a narrow 3-category
        classifier — always call it for any request touching customer records,
        properties, equipment, documents, warranties, Mass Save rebates,
        tasks, or job/schedule information, including simple lookups. Never
        try to answer these from memory, guess an answer, or fall back to
        general knowledge instead of calling this tool: the CRM database is
        the only source of truth for this data.


        Supports, among others: finding/adding/updating/deleting a customer;
        adding/updating/deleting a customer's properties and equipment;
        listing a customer's documents; generating a REAL priced
        estimate/invoice/proposal from the live price book (good/better/best
        tiered, or a flat single price on request) and updating or deleting
        an existing one; creating or updating a warranty registration;
        drafting a Mass Save Air Source Heat Pump rebate application; and
        adding, listing, or completing follow-up tasks/to-dos. Actions taken
        here are real and immediate (no separate confirmation step) — pass
        the tech's request straight through in natural language and relay
        back exactly what the reply says happened.


        If a request is ambiguous (e.g. which existing customer, which
        document) the reply will ask a clarifying question — relay that
        question back to the user rather than guessing an ID.
      operationId: sendAgentCommand
      security:
        - bearerAuth: []
          vercelProtectionBypass: []
      parameters:
        - name: x-vercel-protection-bypass
          in: header
          required: true
          description: Must match the project's VERCEL_AUTOMATION_BYPASS_SECRET.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: >
                    One-line natural-language instruction covering any CRM
                    action or lookup — not limited to creating things, e.g.
                    "Look up Jane Doe's job history", "What equipment is
                    installed at 12 Main St", "Add a task to follow up with
                    John Smith Friday", "Register a warranty for the heat
                    pump we just installed at 12 Main St".
                  example: "Create an estimate for John Smith - replacing a leaking condenser at 12 Main St"
      responses:
        "200":
          description: Command processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                    example: "Added customer Jane Doe."
        "401":
          description: Missing or invalid auth
        "400":
          description: Missing command in request body

components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Value must be the literal string "Bearer <COPILOT_API_KEY>", including the "Bearer " prefix
        (modeled as apiKey because Swagger 2.0 has no native bearer-scheme type).
    vercelProtectionBypass:
      type: apiKey
      in: header
      name: x-vercel-protection-bypass
